<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b09">
<meta name="description" content="MANDO OS: an interactive operating-system experience for your browser. Works offline.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MANDO OS">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>MANDO OS</title>
<style>
/* MANDO OS styles: tokens, shell, shared components. App-specific styles live in apps.css. */
:root {
  color-scheme: dark;
  --bg: #080b09; --s1: #101612; --s2: #171f19; --s3: #202a22;
  --green: #537d5b; --accent: #8dbb91; --accent-text: #8dbb91; --on-accent: #07110a;
  --text: #f5f7f4; --text2: #a5aea6; --muted: #7f8a81;
  --border: rgba(255, 255, 255, 0.09); --glow: rgba(83, 125, 91, 0.18);
  --danger: #e58f84; --ok: #8dbb91; --warn: #e2c27a;
  --r: 16px; --r-sm: 10px; --r-lg: 24px;
  --gap: 12px; --pad: 16px;
  --bar-h: 40px; --dock-h: 68px;
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
}
:root[data-accent="mint"] { --accent: #7fd1ae; --green: #3f8f73; }
:root[data-accent="moss"] { --accent: #b5c97a; --green: #76873f; }
:root[data-accent="pine"] { --accent: #6fb3a0; --green: #3f7a6b; }
:root[data-density="compact"] { --gap: 8px; --pad: 12px; }

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #eef2ee; --s1: #ffffff; --s2: #f3f6f3; --s3: #e4eae4;
    --accent-text: color-mix(in srgb, var(--accent) 40%, #0b1a0f);
    --text: #0e1410; --text2: #455048; --muted: #5a665c;
    --border: rgba(0, 0, 0, 0.12); --glow: rgba(83, 125, 91, 0.16);
    --danger: #a8372b; --ok: #2f6b3b; --warn: #8a6410;
    --shadow: 0 10px 30px rgba(20, 40, 25, 0.18);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #eef2ee; --s1: #ffffff; --s2: #f3f6f3; --s3: #e4eae4;
  --accent-text: color-mix(in srgb, var(--accent) 40%, #0b1a0f);
  --text: #0e1410; --text2: #455048; --muted: #5a665c;
  --border: rgba(0, 0, 0, 0.12); --glow: rgba(83, 125, 91, 0.16);
  --danger: #a8372b; --ok: #2f6b3b; --warn: #8a6410;
  --shadow: 0 10px 30px rgba(20, 40, 25, 0.18);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none; touch-action: manipulation;
}
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; border-radius: 6px; }
::selection { background: var(--glow); }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--s3); border-radius: 8px; }

#os { position: fixed; inset: 0; background: var(--bg); overflow: hidden; }
#wall { position: absolute; inset: 0; background: var(--bg); }
:root[data-wall="forest"] #wall { background: radial-gradient(120% 70% at 20% 0%, rgba(83,125,91,0.34), transparent 60%), radial-gradient(90% 60% at 100% 100%, rgba(83,125,91,0.18), transparent 60%), var(--bg); }
:root[data-wall="dusk"] #wall { background: linear-gradient(170deg, rgba(60,110,110,0.30) 0%, transparent 55%), radial-gradient(80% 50% at 0% 100%, rgba(83,125,91,0.22), transparent 70%), var(--bg); }
:root[data-wall="grid"] #wall { background: linear-gradient(rgba(141,187,145,0.07) 1px, transparent 1px) 0 0 / 32px 32px, linear-gradient(90deg, rgba(141,187,145,0.07) 1px, transparent 1px) 0 0 / 32px 32px, radial-gradient(100% 60% at 50% 0%, rgba(83,125,91,0.22), transparent 70%), var(--bg); }
:root[data-wall="plain"] #wall { background: var(--bg); }
#stage { position: absolute; inset: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }

/* ---------- status bar ---------- */
#statusbar { position: absolute; z-index: 25; top: 0; left: 0; right: 0; height: var(--bar-h); display: flex; align-items: center; gap: 4px; padding: 0 8px 0 16px; font-size: 13px; font-variant-numeric: tabular-nums; }
#statusbar .time { font-weight: 600; letter-spacing: 0.02em; }
#statusbar .spacer { flex: 1; }
.sb-ind { display: inline-flex; align-items: center; gap: 4px; color: var(--text2); padding: 0 4px; min-height: 28px; font-size: 12px; }
.sb-btn { position: relative; width: 40px; height: 40px; display: grid; place-items: center; background: none; border: 0; border-radius: 12px; color: var(--text); }
.sb-btn:active { background: var(--s2); }
.badge { position: absolute; top: 4px; right: 2px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--accent); color: var(--on-accent); font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.batt { display: inline-flex; align-items: center; gap: 4px; }
.batt i { display: inline-block; width: 20px; height: 10px; border: 1.5px solid var(--text2); border-radius: 3px; position: relative; }
.batt i::after { content: ""; position: absolute; left: 1px; top: 1px; bottom: 1px; width: var(--lvl, 100%); max-width: calc(100% - 2px); background: var(--accent-text); border-radius: 1px; }
.batt i::before { content: ""; position: absolute; right: -4px; top: 2px; width: 2px; height: 4px; background: var(--text2); border-radius: 0 1px 1px 0; }

/* ---------- home ---------- */
#home { position: absolute; z-index: 1; top: var(--bar-h); bottom: var(--dock-h); left: 0; right: 0; overflow-y: auto; overscroll-behavior: contain; padding: 8px max(16px, 0px) 24px; }
.home-inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.wordmark { font-weight: 800; letter-spacing: 0.34em; font-size: 13px; color: var(--text); }
.wordmark b { color: var(--accent-text); font-weight: 700; letter-spacing: 0.2em; margin-left: 0.5em; }
.clock-block { padding: 12px 4px 0; }
.clock-big { font-size: clamp(52px, 17vw, 92px); font-weight: 300; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.clock-date { color: var(--text2); margin-top: 6px; }
.clock-greet { color: var(--accent-text); margin-top: 2px; font-weight: 600; }
.card { background: color-mix(in srgb, var(--s1) 88%, transparent); border: 1px solid var(--border); border-radius: var(--r); padding: var(--pad); }
.overview { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: var(--gap); }
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat span { color: var(--text2); font-size: 12px; }
.section-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 600; }
.search { display: flex; align-items: center; gap: 8px; background: var(--s1); border: 1px solid var(--border); border-radius: 14px; padding: 0 12px; min-height: 46px; color: var(--text2); }
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text); min-height: 44px; }
.search:focus-within { border-color: var(--accent-text); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap); }
.tile { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; text-align: left; padding: var(--pad); background: color-mix(in srgb, var(--s1) 88%, transparent); border: 1px solid var(--border); border-radius: var(--r); min-height: 112px; min-width: 0; }
.tile:active { background: var(--s2); }
.tile .ic { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--glow); color: var(--accent-text); border: 1px solid var(--border); flex: none; }
.tile .nm { font-weight: 600; }
.tile .ds { color: var(--text2); font-size: 12.5px; line-height: 1.35; }
.tile .nm, .tile .ds { display: block; overflow-wrap: anywhere; }
.tile-tools { position: absolute; top: 6px; right: 6px; display: flex; gap: 2px; }
.mini { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 10px; background: var(--s2); color: var(--text); }
.mini[disabled] { opacity: 0.35; }
@media (min-width: 560px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 900px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

/* ---------- dock ---------- */
#dock { position: absolute; z-index: 20; left: 0; right: 0; bottom: 0; height: var(--dock-h); display: flex; justify-content: center; align-items: center; gap: 4px; padding: 6px 8px; background: color-mix(in srgb, var(--bg) 82%, transparent); border-top: 1px solid var(--border); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.dk { position: relative; width: 52px; height: 52px; border-radius: 15px; border: 0; background: none; color: var(--text2); display: grid; place-items: center; flex: none; }
.dk:active, .dk:hover { background: var(--s2); color: var(--text); }
.dk.run::after { content: ""; position: absolute; bottom: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.dk.cur { background: var(--glow); color: var(--accent-text); }
.dk-sep { width: 1px; height: 28px; background: var(--border); margin: 0 4px; }
@media (max-width: 380px) { .dk { width: 46px; } }

/* ---------- windows ---------- */
#windows { position: absolute; z-index: 10; inset: var(--bar-h) 0 var(--dock-h) 0; pointer-events: none; }
.win { position: absolute; inset: 0; pointer-events: auto; background: var(--bg); display: none; flex-direction: column; overflow: hidden; animation: winIn 0.22s ease-out; }
.win.front:not(.min) { display: flex; }
.win-bar { display: flex; align-items: center; gap: 6px; min-height: 48px; padding: 4px 8px; border-bottom: 1px solid var(--border); background: var(--s1); flex: none; user-select: none; -webkit-user-select: none; }
.win-title { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; font-weight: 600; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.win-title svg { color: var(--accent-text); flex: none; }
.wb { width: 40px; height: 40px; display: grid; place-items: center; border: 0; background: none; border-radius: 12px; color: var(--text); flex: none; }
.wb:active, .wb:hover { background: var(--s3); }
.wb.min-btn { display: none; }
.win-body { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; position: relative; }
@keyframes winIn { from { opacity: 0; transform: translateY(14px) scale(0.985); } to { opacity: 1; transform: none; } }
:root[data-motion="off"] *, :root[data-motion="off"] *::before, :root[data-motion="off"] *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }

@media (min-width: 900px) and (hover: hover) {
  .win { inset: auto; left: var(--x, 80px); top: var(--y, 20px); width: var(--w, 560px); height: var(--h, 600px); min-width: 340px; min-height: 360px; max-width: 100%; max-height: 100%; border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); resize: both; }
  .win:not(.min) { display: flex; }
  .win.front { z-index: 5; }
  .win:not(.front) { opacity: 0.96; }
  .win-bar { cursor: grab; }
  .wb.min-btn { display: grid; }
  .wb.back-btn { display: none; }
  #home { padding-inline: 32px; }
}

/* ---------- panels (notifications, quick settings) ---------- */
#scrim { position: absolute; inset: 0; z-index: 39; background: rgba(0, 0, 0, 0.45); }
.panel { position: absolute; z-index: 40; top: 0; left: 0; right: 0; max-height: 86%; overflow: auto; background: var(--s1); border-bottom: 1px solid var(--border); border-radius: 0 0 var(--r-lg) var(--r-lg); box-shadow: var(--shadow); padding: 12px 16px 18px; animation: panelIn 0.2s ease-out; }
@media (min-width: 640px) { .panel { left: auto; right: 12px; top: 8px; width: 400px; border-radius: var(--r-lg); border: 1px solid var(--border); } }
@keyframes panelIn { from { transform: translateY(-16px); opacity: 0; } to { transform: none; opacity: 1; } }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.panel-head h2 { font-size: 17px; }
.notif { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--s2); margin-bottom: 8px; }
.notif.error { border-color: var(--danger); }
.notif b { font-weight: 600; }
.notif small { color: var(--muted); }
.qs-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.qs { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; padding: 12px; border-radius: 14px; background: var(--s2); border: 1px solid var(--border); text-align: left; min-height: 74px; }
.qs[aria-pressed="true"] { background: var(--glow); border-color: var(--accent-text); }
.qs small { color: var(--text2); }
.qs svg { color: var(--accent-text); }

/* ---------- switcher ---------- */
#switcher { position: absolute; z-index: 30; inset: var(--bar-h) 0 var(--dock-h) 0; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); overflow-y: auto; padding: 16px; }
.sw-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--gap); max-width: 760px; margin: 0 auto; }
.sw-card { position: relative; display: flex; flex-direction: column; gap: 10px; padding: 14px; background: var(--s1); border: 1px solid var(--border); border-radius: var(--r); text-align: left; min-height: 120px; }
.sw-card.cur { border-color: var(--accent-text); }
.sw-card .x { position: absolute; top: 6px; right: 6px; }

/* ---------- lock screen ---------- */
#lock { position: absolute; inset: 0; z-index: 50; display: flex; flex-direction: column; justify-content: space-between; align-items: center; text-align: center; padding: calc(env(safe-area-inset-top, 0px) + 56px) 24px calc(env(safe-area-inset-bottom, 0px) + 28px); touch-action: none; transition: transform 0.35s cubic-bezier(.2,.8,.2,1), opacity 0.35s; }
#lock-bg { position: absolute; inset: 0; z-index: -1; background: var(--bg); }
:root[data-wall="forest"] #lock-bg { background: radial-gradient(120% 70% at 20% 0%, rgba(83,125,91,0.45), transparent 60%), radial-gradient(90% 60% at 100% 100%, rgba(83,125,91,0.25), transparent 60%), var(--bg); }
:root[data-wall="dusk"] #lock-bg { background: linear-gradient(170deg, rgba(60,110,110,0.4) 0%, transparent 55%), var(--bg); }
:root[data-wall="grid"] #lock-bg { background: linear-gradient(rgba(141,187,145,0.07) 1px, transparent 1px) 0 0 / 32px 32px, linear-gradient(90deg, rgba(141,187,145,0.07) 1px, transparent 1px) 0 0 / 32px 32px, var(--bg); }
#lock.gone { transform: translateY(-100%); opacity: 0; pointer-events: none; }
.lock-time { font-size: clamp(68px, 22vw, 120px); font-weight: 200; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; }
.lock-date { color: var(--text2); margin-top: 8px; font-size: 17px; }
.lock-note { margin-top: 18px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 14px; background: color-mix(in srgb, var(--s1) 80%, transparent); color: var(--text2); font-size: 14px; }
.unlock { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.unlock .btn { min-width: 180px; }
.unlock small { color: var(--muted); max-width: 300px; }
.chev { width: 36px; height: 5px; border-radius: 3px; background: var(--text2); opacity: 0.6; }

/* ---------- boot ---------- */
#boot { position: absolute; inset: 0; z-index: 80; background: #080b09; display: grid; place-items: center; transition: opacity 0.4s; }
#boot.gone { opacity: 0; pointer-events: none; }
.boot-in { display: flex; flex-direction: column; align-items: center; gap: 22px; color: #f5f7f4; }
.boot-in .wordmark { font-size: 22px; color: #f5f7f4; }
.boot-bar { width: 160px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
.boot-bar i { display: block; height: 100%; width: 0; background: #8dbb91; animation: boot 1s ease-out forwards; }
@keyframes boot { to { width: 100%; } }

/* ---------- dialogs, toast, dim ---------- */
#dialogs { position: absolute; inset: 0; z-index: 60; pointer-events: none; }
.dlg-scrim { position: absolute; inset: 0; background: rgba(0,0,0,0.55); display: grid; place-items: center; padding: 16px; pointer-events: auto; }
.dlg { width: min(420px, 100%); background: var(--s1); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
.dlg h2 { font-size: 18px; }
.dlg p { color: var(--text2); overflow-wrap: anywhere; }
.dlg label { font-size: 13px; color: var(--text2); }
.dlg-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.err { color: var(--danger); min-height: 1.2em; font-size: 13px; }
#toast { position: absolute; z-index: 70; left: 50%; transform: translateX(-50%); bottom: calc(var(--dock-h) + 14px); max-width: min(92%, 420px); background: var(--s3); color: var(--text); border: 1px solid var(--border); border-radius: 14px; padding: 10px 14px; box-shadow: var(--shadow); font-size: 14px; overflow-wrap: anywhere; pointer-events: none; }
#toast[data-kind="error"] { border-color: var(--danger); }
#dim { position: absolute; inset: 0; z-index: 90; background: #000; opacity: 0; pointer-events: none; }

/* ---------- shared controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--s2); color: var(--text); font-weight: 600; }
.btn:active { background: var(--s3); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.btn.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.field { width: 100%; min-height: 44px; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--s2); color: var(--text); }
.field:focus { outline: none; border-color: var(--accent-text); }
textarea.field { resize: vertical; min-height: 120px; line-height: 1.5; }
.mono { font-family: var(--mono); }
.seg { display: flex; flex-wrap: wrap; gap: 4px; padding: 3px; background: var(--s2); border: 1px solid var(--border); border-radius: 12px; }
.seg button { flex: 1 1 auto; min-height: 38px; padding: 0 12px; border-radius: 9px; border: 0; background: none; color: var(--text2); font-weight: 600; }
.seg button.on { background: var(--accent); color: var(--on-accent); }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); min-width: 0; }
.row:last-child { border-bottom: 0; }
.row .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.row-title { font-weight: 500; overflow-wrap: anywhere; }
.row-hint { color: var(--text2); font-size: 13px; overflow-wrap: anywhere; }
.toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.sw { width: 46px; height: 28px; border-radius: 14px; background: var(--s3); border: 1px solid var(--border); position: relative; flex: none; transition: background 0.2s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--text2); transition: transform 0.2s, background 0.2s; }
.toggle input:checked + .sw { background: var(--accent); }
.toggle input:checked + .sw::after { transform: translateX(18px); background: var(--on-accent); }
.toggle input:focus-visible + .sw { outline: 2px solid var(--accent-text); outline-offset: 2px; }
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; padding: 32px 20px; color: var(--text2); flex: 1; }
.empty svg { color: var(--accent-text); opacity: 0.8; }
.empty strong { color: var(--text); font-size: 16px; }
.empty p { max-width: 320px; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid var(--border); background: var(--s2); color: var(--text2); }
.pill.ok { color: var(--ok); border-color: currentColor; }
.pill.warn { color: var(--warn); border-color: currentColor; }
.pill.bad { color: var(--danger); border-color: currentColor; }
.pill.sim { color: var(--warn); border-color: currentColor; text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px; }
.note-box { padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--glow); color: var(--text2); font-size: 13.5px; }
input[type="range"] { width: 100%; accent-color: var(--accent); min-height: 32px; }

<script>
/* Notes, Tasks, Calculator */
(function () {
  'use strict';
  const M = window.MANDO, h = M.h;

  /* ================= NOTES ================= */
  M.registerApp({
    id: 'notes', name: 'Notes', icon: 'notes', desc: 'Write and search local notes', category: 'Productivity', version: '2.1',
    mount: function (root) {
      let current = null, dirty = false, query = '';
      const view = h('div', { class: 'editor' });
      root.appendChild(view);

      const title = (n) => n.title.trim() || n.body.trim().split('\n')[0].slice(0, 60) || 'Untitled note';
      const save = M.debounce(flush, 500);
      function flush() {
        if (!current) return;

        if (!stored) M.state.notes.unshift(current);
        current.updated = Date.now();

          M.save.notes();

        current = null; dirty = false;
        view.textContent = '';
        const list = h('div', { class: 'list', role: 'list' });
        const search = h('input', { type: 'search', id: 'notes-q', placeholder: 'Search notes', 'aria-label': 'Search notes', value: query, autocomplete: 'off', oninput: function (e) { query = e.target.value.toLowerCase(); paint(); } });

          h('div', { class: 'toolbar' }, h('label', { class: 'search', for: 'notes-q' }, M.icon('search', 18), search),
            h('button', { class: 'btn primary', onclick: function () { edit({ id: M.uid(), title: '', body: '', updated: Date.now() }, true); } }, M.icon('plus', 18), 'New')),
          list);
        function paint() {
          list.textContent = '';
          const items = M.state.notes.filter(function (n) { return !query || (n.title + ' ' + n.body).toLowerCase().indexOf(query) >= 0; })

              h('button', { class: 'mini', 'aria-label': 'Delete ' + t.text, onclick: function () { M.state.tasks = M.state.tasks.filter(function (x) { return x.id !== t.id; }); M.save.tasks(); paint(); } }, M.icon('trash', 16)));

            M.confirm({ title: 'Clear completed tasks?', message: (all.length - active) + ' completed task(s) will be deleted.', confirmLabel: 'Clear', danger: true }).then(function (ok) {
              if (ok) { M.state.tasks = M.state.tasks.filter(function (x) { return !x.done; }); M.save.tasks(); paint(); }

  /* ================= CALCULATOR ================= */
  // Safe recursive-descent evaluator. No eval(). "%" divides by 100; "200+10%" means 200 + 10% of 200.
  M.calcEval = function (src) {
    const s = src.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
    const tokens = [];
    let i = 0;
    while (i < s.length) {
      const c = s[i];
      if (c === ' ') { i++; continue; }
      if (/[0-9.]/.test(c)) {
        const m = /^(\d+\.?\d*|\.\d+)/.exec(s.slice(i));
        if (!m) throw new Error('Invalid number');
        tokens.push({ n: parseFloat(m[1]) }); i += m[1].length;
      } else if ('+-*/%()'.indexOf(c) >= 0) { tokens.push({ v: c }); i++; }
      else throw new Error('Invalid character');
    }
    if (!tokens.length) throw new Error('Nothing to calculate');
    let p = 0;
    const peek = function () { return tokens[p]; };
    function expr() {
      let left = term();
      while (peek() && (peek().v === '+' || peek().v === '-')) {
        const op = tokens[p++].v, right = term();
        const r = right.pct ? left.v * right.v : right.v;
        left = { v: op === '+' ? left.v + r : left.v - r, pct: false };
      }
      return left;
    }
    function term() {
      let left = unary();
      while (peek() && (peek().v === '*' || peek().v === '/')) {
        const op = tokens[p++].v, right = unary();
        if (op === '/') { if (right.v === 0) throw new Error('Cannot divide by zero'); left = { v: left.v / right.v, pct: false }; }
        else left = { v: left.v * right.v, pct: false };
      }
      return left;
    }
    function unary() {
      const t = peek();
      if (t && t.v === '-') { p++; const u = unary(); return { v: -u.v, pct: u.pct }; }
      if (t && t.v === '+') { p++; return unary(); }
      return postfix();
    }
    function postfix() {
      let a = primary();
      while (peek() && peek().v === '%') { p++; a = { v: a.v / 100, pct: true }; }
      return a;
    }
    function primary() {
      const t = tokens[p++];
      if (!t) throw new Error('Incomplete expression');
      if (t.n !== undefined) return { v: t.n, pct: false };
      if (t.v === '(') { const e = expr(); if (!tokens[p] || tokens[p].v !== ')') throw new Error('Missing closing bracket'); p++; return { v: e.v, pct: false }; }
      throw new Error('Invalid expression');
    }
    const r = expr();
    if (p < tokens.length) throw new Error('Invalid expression');
    if (!isFinite(r.v)) throw new Error('Result is too large');
    return r.v;
  };
  M.calcFormat = function (n) {
    if (n === 0) return '0';
    const a = Math.abs(n);
    if (a >= 1e15 || a < 1e-9) return n.toExponential(6).replace(/\.?0+e/, 'e');
    const x = parseFloat(n.toPrecision(12));
    return x.toLocaleString(undefined, { maximumFractionDigits: 10 });
  };

  M.registerApp({
    id: 'calc', name: 'Calculator', icon: 'calc', desc: 'Everyday arithmetic with history', category: 'Utilities', version: '2.1',
    mount: function (root, ctx) {
      let expr = '', fresh = false, history = M.storage.get('calcHistory', []);
      if (!Array.isArray(history)) history = [];
      history = history.filter(function (x) { return x && typeof x.e === 'string' && typeof x.r === 'string'; }).slice(0, 30);
      const exprEl = h('div', { class: 'calc-expr' }), resEl = h('div', { class: 'calc-res', 'aria-live': 'polite' });
      const histEl = h('div', { class: 'hist' });
      const pretty = function (s) { return s.replace(/\*/g, '×').replace(/\//g, '÷').replace(/-/g, '−'); };
      function show(err) {
        exprEl.textContent = pretty(expr);
        resEl.classList.toggle('bad', !!err);
        if (err) { resEl.textContent = err; return; }
        if (!expr) { resEl.textContent = '0'; return; }
        try { resEl.textContent = M.calcFormat(M.calcEval(expr)); } catch (e) { resEl.textContent = expr.slice(-14); resEl.classList.remove('bad'); if (/[+\-*/]$/.test(expr)) resEl.textContent = pretty(expr.slice(-14)); }
      }
      function paintHist() {
        histEl.textContent = '';
        if (!history.length) { histEl.appendChild(h('p', { class: 'row-hint', style: 'text-align:center', text: 'Your calculations appear here.' })); return; }
        history.forEach(function (x) { histEl.appendChild(h('button', { onclick: function () { expr = x.r.replace(/,/g, ''); fresh = true; show(); }, text: pretty(x.e) + ' = ' + x.r })); });
      }
      function press(k) {
        const last = expr.slice(-1), isOp = /[+\-*/]/.test(k);
        if (/[0-9]/.test(k)) { if (fresh) { expr = ''; fresh = false; } expr += k; }
        else if (k === '.') {
          if (fresh) { expr = ''; fresh = false; }
          const cur = expr.split(/[+\-*/%()]/).pop();
          if (cur.indexOf('.') >= 0) return show();
          expr += cur === '' ? '0.' : '.';
        } else if (isOp) {
          fresh = false;
          if (!expr) { if (k === '-') expr = '-'; return show(); }
          if (/[+\-*/]/.test(last)) { if (expr.length === 1) return show(); expr = expr.slice(0, -1) + k; }
          else expr += k;
        } else if (k === '%') { fresh = false; if (expr && /[0-9%)]/.test(last)) expr += '%'; }
        else if (k === 'C') { expr = ''; fresh = false; }
        else if (k === 'B') { if (fresh) { expr = ''; fresh = false; } else expr = expr.slice(0, -1); }
        else if (k === '=') {
          if (!expr) return show('Enter a calculation first');
          try {
            const r = M.calcFormat(M.calcEval(expr));
            history.unshift({ e: expr, r: r }); history = history.slice(0, 30); M.storage.set('calcHistory', history); paintHist();
            exprEl.textContent = pretty(expr) + ' ='; resEl.textContent = r; resEl.classList.remove('bad');
            const v = parseFloat(M.calcEval(expr).toPrecision(12)); expr = /e/i.test(String(v)) ? '' : String(v); fresh = true; return;
          } catch (e) { return show(e.message); }
        }
        show();
      }
      const layout = [['C', 'op'], ['B', 'op', '⌫'], ['%', 'op'], ['/', 'op', '÷'], '7', '8', '9', ['*', 'op', '×'], '4', '5', '6', ['-', 'op', '−'], '1', '2', '3', ['+', 'op'], ['0', '', '0', 'wide'], '.', ['=', 'eq']];
      const keys = h('div', { class: 'keys' });
      layout.forEach(function (k) {
        const key = Array.isArray(k) ? k[0] : k, cls = Array.isArray(k) ? k[1] : '', label = Array.isArray(k) && k[2] ? k[2] : key, wide = Array.isArray(k) && k[3];
        const names = { C: 'Clear', B: 'Delete last', '/': 'Divide', '*': 'Multiply', '-': 'Subtract', '+': 'Add', '=': 'Equals', '%': 'Percent', '.': 'Decimal point' };
        keys.appendChild(h('button', { class: 'key ' + cls + (key === '=' ? '' : '') + (wide ? ' wide' : ''), 'aria-label': names[key] || key, text: label, onclick: function () { press(key); } }));
      });
      const clearHist = h('button', { class: 'btn sm', onclick: function () { history = []; M.storage.set('calcHistory', history); paintHist(); }, text: 'Clear history' });
      root.appendChild(h('div', { class: 'calc' }, h('div', { class: 'calc-disp' }, exprEl, resEl), keys,
        h('div', { class: 'rowx' }, h('span', { class: 'h3 grow', text: 'History' }), clearHist), histEl));
      show(); paintHist();
      function onKey(e) {
        if (!ctx.isFront() || e.ctrlKey || e.metaKey || e.altKey) return;
        if (/^(INPUT|TEXTAREA)$/.test((e.target.tagName || ''))) return;
        const k = e.key;
        if (/^[0-9.+\-*/%]$/.test(k)) press(k);
        else if (k === 'Enter' || k === '=') { e.preventDefault(); press('='); }
        else if (k === 'Backspace') press('B');
        else if (k === 'Escape' || k === 'c' || k === 'C') press('C');
        else return;
      }
      document.addEventListener('keydown', onKey);
      return { unmount: function () { document.removeEventListener('keydown', onKey); } };
    }
  });
})();

<script>
/* Virtual file system (stored in this browser) and the Files app. */
(function () {
  'use strict';
  const M = window.MANDO, h = M.h;

  const TEXT_EXT = ['txt', 'md', 'json', 'csv', 'log', 'js', 'css', 'html', 'htm', 'xml', 'yaml', 'yml', 'ini', 'sh', 'py'];
  const IMG_EXT = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg'];
  const MAX_TEXT = 300 * 1024, MAX_IMG = 400 * 1024;
  const ext = function (n) { const i = n.lastIndexOf('.'); return i > 0 ? n.slice(i + 1).toLowerCase() : ''; };
  const kindOf = function (n) { const e = ext(n.name); return n.type === 'dir' ? 'dir' : IMG_EXT.indexOf(e) >= 0 && n.content.indexOf('data:image') === 0 ? 'image' : 'text'; };

  /* ---------- file system model ---------- */
  const FS = (M.fs = { nodes: [] });
  function seed() {
    const now = Date.now(), n = [];
    const mk = function (id, name, type, parent, content) { n.push({ id: id, name: name, type: type, parent: parent, content: content || '', created: now, updated: now }); };
    mk('docs', 'Documents', 'dir', 'root'); mk('pics', 'Pictures', 'dir', 'root'); mk('proj', 'Projects', 'dir', 'root');
    mk('readme', 'readme.txt', 'file', 'root', 'Welcome to MANDO OS.\n\nThis is a virtual file system stored in your browser. It is not your phone\'s storage.\nYou can create, rename and delete files here, import small text files and images, and open HTML files in the Browser app.\n');
    mk('hello', 'hello.html', 'file', 'proj', '<!doctype html><html><body style="font-family:sans-serif;padding:24px"><h1>Hello from MANDO OS</h1><p>This page lives in the virtual file system and is shown in a sandbox with scripts disabled.</p></body></html>');
    return n;
  }
  function load() {
    const raw = M.storage.get('fs', null);
    let nodes = Array.isArray(raw) ? raw.filter(function (x) { return x && typeof x.id === 'string' && typeof x.name === 'string' && (x.type === 'dir' || x.type === 'file') && typeof x.parent === 'string'; })
      .map(function (x) { return { id: x.id.slice(0, 64), name: x.name.slice(0, 80), type: x.type, parent: x.parent.slice(0, 64), content: typeof x.content === 'string' ? x.content : '', created: +x.created || Date.now(), updated: +x.updated || Date.now() }; }) : null;
    if (!nodes || !nodes.length) nodes = seed();
    const ids = {}; nodes.forEach(function (x) { ids[x.id] = x; });
    FS.nodes = nodes.filter(function (x) { return x.parent === 'root' || (ids[x.parent] && ids[x.parent].type === 'dir'); });
  }
  load();
  const persist = M.debounce(function () { M.storage.set('fs', FS.nodes); M.emit('fs'); }, 250);
  M.flushers.add(function () { M.storage.set('fs', FS.nodes); });
  FS.get = function (id) { return id === 'root' ? { id: 'root', name: '', type: 'dir', parent: null } : FS.nodes.filter(function (x) { return x.id === id; })[0] || null; };
  FS.list = function (parent) { return FS.nodes.filter(function (x) { return x.parent === parent; }).sort(function (a, b) { return a.type === b.type ? a.name.localeCompare(b.name) : (a.type === 'dir' ? -1 : 1); }); };
  FS.pathOf = function (id) { const parts = []; let n = FS.get(id); while (n && n.id !== 'root') { parts.unshift(n.name); n = FS.get(n.parent); } return '/' + parts.join('/'); };
  FS.child = function (parent, name) { return FS.nodes.filter(function (x) { return x.parent === parent && x.name === name; })[0] || null; };
  FS.resolve = function (path, cwd) {
    let cur = path[0] === '/' ? 'root' : cwd;
    const parts = path.split('/').filter(Boolean);
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      if (p === '.') continue;
      if (p === '..') { const n = FS.get(cur); cur = n && n.parent ? n.parent : 'root'; continue; }
      const c = FS.child(cur, p);
      if (!c) return null;
      cur = c.id;
    }
    return FS.get(cur);
  };
  FS.validName = function (name, parent, selfId) {
    if (!name || !name.trim()) return 'Enter a name.';
    if (name.length > 80) return 'Names can be up to 80 characters.';
    if (/[\/\\]/.test(name) || name === '.' || name === '..') return 'A name cannot contain slashes or be "." or "..".';
    const dup = FS.child(parent, name);
    if (dup && dup.id !== selfId) return 'An item with that name already exists here.';
    return '';
  };
  FS.create = function (type, name, parent, content) {
    const err = FS.validName(name, parent); if (err) throw new Error(err);
    const now = Date.now(), n = { id: M.uid(), name: name, type: type, parent: parent, content: content || '', created: now, updated: now };
    FS.nodes.push(n); persist(); return n;
  };
  FS.rename = function (id, name) { const n = FS.get(id); const err = FS.validName(name, n.parent, id); if (err) throw new Error(err); n.name = name; n.updated = Date.now(); persist(); };
  FS.write = function (id, content) { const n = FS.get(id); n.content = content; n.updated = Date.now(); persist(); };

    for (let i = 0; i < kill.length; i++) FS.nodes.forEach(function (x) { if (x.parent === kill[i]) kill.push(x.id); });
    FS.nodes = FS.nodes.filter(function (x) { return kill.indexOf(x.id) < 0; }); persist();
  };
  FS.size = function (n) { return n.type === 'dir' ? FS.list(n.id).length + ' items' : M.fmtBytes(new Blob([n.content]).size); };
  FS.usage = function () { return FS.nodes.reduce(function (a, n) { return a + n.content.length * 2; }, 0); };
  FS.reset = function () { FS.nodes = seed(); persist(); };

  /* ---------- Files app ---------- */
  M.registerApp({
    id: 'files', name: 'Files', icon: 'files', desc: 'Virtual folders and files inside MANDO OS', category: 'Productivity', version: '2.1',
    mount: function (root) {
      let cwd = 'root', open = null, objectUrl = null;
      const view = h('div', { class: 'viewer', style: 'flex:1;min-height:0;display:flex;flex-direction:column' });
      const picker = h('input', { type: 'file', multiple: true, hidden: true, id: 'files-import', 'aria-label': 'Import files' });
      const quick = h('input', { type: 'file', hidden: true, id: 'files-quick', 'aria-label': 'Open a file from your device' });
      root.append(view, picker, quick);
      function revoke() { if (objectUrl) { URL.revokeObjectURL(objectUrl); objectUrl = null; } }
      const fail = function (msg) { M.toast(msg, 'error'); };

      function browse() {
        open = null; revoke(); view.textContent = '';
        const list = h('div', { class: 'list', role: 'list' });
        const crumbs = h('div', { class: 'crumbs', 'aria-label': 'Folder path' });
        const trail = []; let n = FS.get(cwd);
        while (n && n.id !== 'root') { trail.unshift(n); n = FS.get(n.parent); }
        crumbs.appendChild(h('button', { onclick: function () { cwd = 'root'; browse(); }, text: 'MANDO' }));
        trail.forEach(function (t) { crumbs.append('/', h('button', { onclick: function () { cwd = t.id; browse(); }, text: t.name })); });
        view.append(
          h('div', { class: 'toolbar' },
            h('button', { class: 'btn sm', disabled: cwd === 'root', 'aria-label': 'Up one folder', onclick: function () { cwd = FS.get(cwd).parent || 'root'; browse(); } }, M.icon('up', 16), 'Up'),
            h('button', { class: 'btn sm', onclick: function () { newItem('dir'); } }, M.icon('folder', 16), 'New folder'),
            h('button', { class: 'btn sm', onclick: function () { newItem('file'); } }, M.icon('plus', 16), 'New file'),
            h('button', { class: 'btn sm', onclick: function () { picker.click(); } }, M.icon('upload', 16), 'Import'),
            h('button', { class: 'btn sm', onclick: function () { quick.click(); } }, 'Quick open')),
          crumbs, list,
          h('p', { class: 'limits', style: 'padding:8px var(--pad)', text: 'This is a virtual drive stored in this browser. Browsers cannot open your phone’s whole storage; Import and Quick open only read files you pick. Import accepts text files up to 300 KB and images up to 400 KB.' }));
        const items = FS.list(cwd);
        if (!items.length) list.appendChild(M.empty('folder', 'This folder is empty', 'Create a file or folder, or import something from your device.'));
        items.forEach(function (it) {
          list.appendChild(h('div', { class: 'li', role: 'listitem' },
            h('button', { class: 'grow', style: 'display:flex;gap:10px;align-items:center;background:none;border:0;text-align:left;min-width:0;padding:0', 'aria-label': (it.type === 'dir' ? 'Open folder ' : 'Open file ') + it.name, onclick: function () { it.type === 'dir' ? (cwd = it.id, browse()) : openFile(it); } },
              h('span', { class: 'fi-ic' }, M.icon(it.type === 'dir' ? 'folder' : kindOf(it) === 'image' ? 'image' : 'file', 20)),
              h('span', { class: 'grow' }, h('span', { class: 't', text: it.name }), h('span', { class: 's', text: FS.size(it) + ' · ' + M.fmtStamp(it.updated) }))),
            h('button', { class: 'mini', 'aria-label': 'Rename ' + it.name, onclick: function () { rename(it); } }, M.icon('edit', 16)),
            h('button', { class: 'mini', 'aria-label': 'Delete ' + it.name, onclick: function () { del(it); } }, M.icon('trash', 16))));
        });
      }
      function newItem(type) {
        M.askText({ title: type === 'dir' ? 'New folder' : 'New text file', label: 'Name', value: type === 'dir' ? '' : 'untitled.txt', validate: function (v) { return FS.validName(v, cwd); } }).then(function (name) {
          if (!name) return;
          try { const n = FS.create(type, name, cwd, ''); M.notify(type === 'dir' ? 'Folder created' : 'File created', name, 'success'); type === 'file' ? openFile(n) : browse(); } catch (e) { fail(e.message); }
        });
      }
      function rename(it) {
        M.askText({ title: 'Rename', label: 'New name', value: it.name, validate: function (v) { return FS.validName(v, it.parent, it.id); } }).then(function (name) {
          if (!name || name === it.name) return;
          try { FS.rename(it.id, name); browse(); } catch (e) { fail(e.message); }
        });
      }
      function del(it) {
        M.confirm({ title: 'Delete ' + (it.type === 'dir' ? 'folder' : 'file') + '?', message: '“' + it.name + '”' + (it.type === 'dir' ? ' and everything inside it' : '') + ' will be permanently deleted from this browser.', confirmLabel: 'Delete', danger: true }).then(function (ok) {
          if (ok) { FS.remove(it.id); M.notify('Deleted', it.name, 'info'); browse(); }
        });
      }

      function openFile(it) {
        open = it; revoke(); view.textContent = '';
        const back = h('button', { class: 'btn sm', onclick: browse }, M.icon('back', 16), 'Back');
        if (kindOf(it) === 'image') {
          view.append(h('div', { class: 'toolbar' }, back, h('strong', { text: it.name })), h('img', { src: it.content, alt: 'Preview of ' + it.name }));
          return;
        }
        const ta = h('textarea', { 'aria-label': 'File contents of ' + it.name, spellcheck: false }); ta.value = it.content;
        const status = h('span', { class: 'row-hint', role: 'status', text: 'Saved' });
        const preview = h('div', { hidden: true, style: 'flex:1;min-height:200px;display:flex' });
        const e = ext(it.name);
        ta.addEventListener('input', function () { status.textContent = 'Unsaved changes'; });
        function save() { FS.write(it.id, ta.value); status.textContent = 'Saved'; M.notify('File saved', it.name, 'success'); }
        const bar = h('div', { class: 'toolbar' }, back, h('strong', { style: 'min-width:0;overflow:hidden;text-overflow:ellipsis', text: it.name }), status, h('span', { style: 'flex:1' }),
          h('button', { class: 'btn sm primary', onclick: save }, M.icon('save', 16), 'Save'),
          h('button', { class: 'btn sm', onclick: function () { M.download(it.name, ta.value); M.notify('File exported', it.name, 'info'); } }, M.icon('download', 16), 'Download'));
        if (e === 'json') bar.appendChild(h('button', { class: 'btn sm', onclick: function () { try { ta.value = JSON.stringify(JSON.parse(ta.value), null, 2); status.textContent = 'Formatted (unsaved)'; } catch (err) { fail('This is not valid JSON.'); } }, text: 'Format JSON' }));
        if (e === 'html' || e === 'htm') bar.appendChild(h('button', { class: 'btn sm', onclick: function () {
          const on = preview.hidden; preview.hidden = !on; ta.hidden = on; preview.textContent = '';
          if (on) preview.appendChild(h('iframe', { sandbox: '', srcdoc: ta.value, title: 'Preview of ' + it.name, style: 'flex:1;border:0;background:#fff;width:100%' }));
        }, text: 'Preview' }));
        view.append(bar, ta, preview);
      }

      picker.addEventListener('change', function () {
        const files = Array.prototype.slice.call(picker.files || []); picker.value = '';
        let added = 0, pending = files.length;
        if (!pending) return;
        files.forEach(function (f) {

      const status = h('p', { class: 'err', role: 'alert', style: 'text-align:center' });
      const listEl = h('div', { class: 'list plist', role: 'list' });
      const savedNote = h('p', { class: 'row-hint', style: 'text-align:center' });

            h('span', { class: 'fi-ic' }, M.icon(i === cur && !audio.paused ? 'pause' : 'music', 18)),
            h('span', { class: 'grow' }, h('span', { class: 't', text: t.name }), h('span', { class: 's', text: M.fmtBytes(t.size) + (t.type ? ' · ' + t.type : '') + (t.bad ? ' · cannot play' : '') }))));

      if (navigator.storage && navigator.storage.persist && st.persisted === false) btns.append(h('button', { class: 'btn', onclick: function () { M.pwa.persist(); } }, 'Protect my data'));
      box.append(btns);
      if (!st.installed && st.swSupported && !st.deferredPrompt) box.append(h('p', { class: 'limits', text: 'If Install is greyed out: open the Chrome menu (three dots) and choose Install app or Add to Home screen. Chrome only offers it after the page has been used for a moment.' }));
      box.append(h('p', { class: 'limits', text: 'Installing gives MANDO OS its own icon, window and offline start. It does not add Android permissions or hardware access: the same browser limits still apply. Updates never delete your notes, tasks, files or settings, because those are stored separately from the app files.' }));
    }
    M.on('pwa', paint); paint();
    return box;
  };
  M.on('pwa', function () {
    const slot = document.getElementById('home-pwa');
    if (!slot) return;
    slot.textContent = '';
    if (!st.waiting) return;
    slot.appendChild(h('div', { class: 'card', style: 'display:flex;gap:12px;align-items:center;flex-wrap:wrap' },
      h('div', { style: 'flex:1;min-width:160px' }, h('strong', { text: 'Update ready' }), h('div', { class: 'row-hint', text: 'A new version of MANDO OS is downloaded. Your data is kept.' })),
      h('button', { class: 'btn primary', onclick: M.pwa.applyUpdate, text: 'Restart to update' })));
  });
})();

</script>
<script>
/* MANDO OS entry point. Runs after all apps have registered. */
(function () {
  'use strict';
  const M = window.MANDO;
  window.addEventListener('error', function (e) {
    console.error(e.error || e.message);
    if (M.notify) M.toast('Something went wrong. Your saved data is safe.', 'error');
  });
  window.addEventListener('unhandledrejection', function (e) { console.error(e.reason); });
  M.startShell();
  // Home-screen shortcuts open an app directly (?app=notes). Only installed apps are accepted.
  try {
    const want = new URLSearchParams(location.search).get('app');
    if (want && M.getApp(want) && M.isInstalled(want)) { if (M.isLocked()) M.pendingApp = want; else M.wm.open(want); }
  } catch (e) { /* ignore malformed URLs */ }
})();

</script>
